# Opsilient: native arm64 builds of the upstream Breeze images (GHCR only publishes amd64).
# Builds straight from the lanternops/breeze tag; this fork's own tree is not used.
name: Build arm64 images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream tag, e.g. v0.115.0"
        required: true
permissions:
  contents: read
  packages: write
env:
  IMAGE_BASE: ghcr.io/opsilient/breeze
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,    file: apps/api/Dockerfile }
          - { name: web,    file: apps/web/Dockerfile }
          - { name: portal, file: apps/portal/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lanternops/breeze
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env: { TAG: "${{ inputs.tag }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.name }}:${{ env.VERSION }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            PUBLIC_APP_VERSION=${{ env.VERSION }}
            PUBLIC_API_URL=
            PORTAL_BASE_PATH=/portal
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64
      - run: echo "${{ matrix.name }} ${{ env.IMAGE_BASE }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
